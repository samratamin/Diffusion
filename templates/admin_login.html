<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — NMR Diffusion Analysis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        .logo {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #111;
        }
        p.sub {
            color: #888;
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input[type=password] {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid #ddd;
            border-radius: 7px;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type=password]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #1e1b4b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #312e81; }
        .error {
            background: #fff5f5;
            color: #c53030;
            border: 1.5px solid #feb2b2;
            border-radius: 7px;
            padding: 0.65rem 0.85rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">NMR Diffusion Analysis</div>
        <h1>Admin Login</h1>
        <p class="sub">Restricted access. Authorized users only.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autofocus required>
            <button type="submit">Sign in</button>
        </form>
        <p style="margin-top:1.25rem; text-align:center; font-size:0.8rem;">
            <a href="/" style="color:#6b7280; text-decoration:none;" onmouseover="this.style.color='#1e1b4b'" onmouseout="this.style.color='#6b7280'">← Back to main app</a>
        </p>
    </div>
</body>
</html>
